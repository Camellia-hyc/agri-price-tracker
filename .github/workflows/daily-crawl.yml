name: daily-crawl

on:
  schedule:
    - cron: "7 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run crawler
        run: node scripts/crawl-pfsc.mjs

      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/mock data/history
          if git diff --cached --quiet; then
            echo "no data change, skip commit"
          else
            git commit -m "chore: update data $(date +%F)"
            git push
          fi
